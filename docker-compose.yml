version: '3.8'

services:
  ner-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ner_logistics_platform
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
